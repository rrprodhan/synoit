<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 1010" role="img" aria-labelledby="title desc">
  <title id="title">Launch and growth analytics</title>
  <desc id="desc">A launch dashboard with growth metrics, monitoring cards, and an upward performance graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="490" y2="1010" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120f1c"/>
      <stop offset=".52" stop-color="#0a1520"/>
      <stop offset="1" stop-color="#100d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="88" y1="280" x2="406" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9a8afb"/>
      <stop offset=".48" stop-color="#26d9d0"/>
      <stop offset="1" stop-color="#ff8a22"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="490" height="1010" rx="78" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="72" y="130" font-size="22" font-weight="700" letter-spacing="4" opacity=".58">LAUNCH</text>
    <text x="72" y="168" font-size="34" font-weight="700">Growth loop</text>
  </g>
  <g fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1">
    <rect x="70" y="232" width="156" height="138" rx="28"/>
    <rect x="264" y="232" width="156" height="138" rx="28"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="96" y="290" font-size="36" font-weight="800">98%</text>
    <text x="96" y="326" font-size="16" font-weight="600" opacity=".6">Health</text>
    <text x="290" y="290" font-size="36" font-weight="800">2.1x</text>
    <text x="290" y="326" font-size="16" font-weight="600" opacity=".6">Growth</text>
  </g>
  <rect x="70" y="440" width="350" height="296" rx="34" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".1"/>
  <g stroke="#fff" stroke-opacity=".1" stroke-width="2">
    <path d="M104 660h282"/>
    <path d="M104 596h282"/>
    <path d="M104 532h282"/>
  </g>
  <path d="M108 666c42-82 78-104 112-75 36 32 65 22 94-48 24-59 50-79 84-108" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="398" cy="435" r="17" fill="#ff8a22" filter="url(#glow)"/>
  <g fill="#fff" opacity=".2">
    <rect x="84" y="802" width="322" height="12" rx="6"/>
    <rect x="84" y="836" width="252" height="12" rx="6"/>
    <rect x="84" y="870" width="286" height="12" rx="6"/>
  </g>
  <path d="M363 218l24 24 42-58" fill="none" stroke="#26d9d0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
