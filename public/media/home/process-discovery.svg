<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 1010" role="img" aria-labelledby="title desc">
  <title id="title">Discovery workshop dashboard</title>
  <desc id="desc">A dark product discovery board with goals, users, constraints, and success signals connected by glowing lines.</desc>
  <defs>
    <linearGradient id="bg" x1="65" y1="0" x2="425" y2="1010" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15111f"/>
      <stop offset=".48" stop-color="#0f1523"/>
      <stop offset="1" stop-color="#120d19"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="140" x2="410" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f7bf7"/>
      <stop offset=".52" stop-color="#26d9d0"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="490" height="1010" rx="78" fill="url(#bg)"/>
  <path d="M72 205h92c24 0 36 12 36 36v94c0 24 12 36 36 36h182" fill="none" stroke="#8f7bf7" stroke-opacity=".28" stroke-width="3"/>
  <path d="M92 703h134c24 0 36-12 36-36V548c0-24 12-36 36-36h103" fill="none" stroke="#26d9d0" stroke-opacity=".24" stroke-width="3"/>
  <circle cx="245" cy="486" r="118" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-dasharray="520 220" filter="url(#glow)"/>
  <circle cx="245" cy="486" r="74" fill="#0b0a12" stroke="#ffffff" stroke-opacity=".08"/>
  <path d="M214 485l22 22 47-58" fill="none" stroke="#f4f1ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff">
    <text x="72" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" opacity=".58">DISCOVERY</text>
    <text x="72" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Goal map</text>
  </g>
  <g fill="#fff" opacity=".82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">
    <text x="86" y="275">Business goal</text>
    <text x="86" y="748">User need</text>
    <text x="286" y="275">Constraints</text>
    <text x="286" y="748">Success KPI</text>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".12">
    <rect x="58" y="222" width="164" height="94" rx="24"/>
    <rect x="268" y="222" width="164" height="94" rx="24"/>
    <rect x="58" y="694" width="164" height="94" rx="24"/>
    <rect x="268" y="694" width="164" height="94" rx="24"/>
  </g>
  <g fill="#8f7bf7" opacity=".72">
    <circle cx="97" cy="850" r="5"/>
    <circle cx="121" cy="850" r="5"/>
    <circle cx="145" cy="850" r="5"/>
    <rect x="176" y="845" width="218" height="10" rx="5" opacity=".28"/>
    <rect x="176" y="876" width="152" height="10" rx="5" opacity=".2"/>
  </g>
</svg>
