<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
  <title id="title">SynoIT connected delivery team</title>
  <desc id="desc">Design, development, AI, and digital growth connected to one shared product roadmap.</desc>
  <defs>
    <linearGradient id="panel" x1="104" y1="54" x2="656" y2="626" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242033"/>
      <stop offset=".55" stop-color="#15131D"/>
      <stop offset="1" stop-color="#0E0D13"/>
    </linearGradient>
    <linearGradient id="accent" x1="246" y1="252" x2="522" y2="436" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDAAFF"/>
      <stop offset=".5" stop-color="#8972F3"/>
      <stop offset="1" stop-color="#CC3366"/>
    </linearGradient>
    <linearGradient id="trace" x1="92" y1="340" x2="670" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F61C5"/>
      <stop offset=".48" stop-color="#B9AAFF"/>
      <stop offset="1" stop-color="#A53970"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#9A8AFB" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9A8AFB" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9A8AFB" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect x="48" y="36" width="664" height="608" rx="54" fill="url(#panel)" stroke="#9A8AFB" stroke-opacity=".24"/>
  <rect x="49" y="37" width="662" height="606" rx="53" fill="url(#grid)"/>
  <ellipse cx="380" cy="340" rx="244" ry="218" fill="url(#halo)"/>

  <g fill="none" stroke="url(#trace)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 306H238Q222 306 222 290V178Q222 162 206 162H176"/>
    <path d="M468 306H522Q538 306 538 290V178Q538 162 554 162H584"/>
    <path d="M292 374H238Q222 374 222 390V502Q222 518 206 518H176"/>
    <path d="M468 374H522Q538 374 538 390V502Q538 518 554 518H584"/>
  </g>

  <g class="moving-traces" fill="none" stroke="#DAD1FF" stroke-width="4.6" stroke-linecap="round" filter="url(#glow)">
    <path d="M292 306H238Q222 306 222 290V178Q222 162 206 162H176"/>
    <path d="M468 306H522Q538 306 538 290V178Q538 162 554 162H584"/>
    <path d="M292 374H238Q222 374 222 390V502Q222 518 206 518H176"/>
    <path d="M468 374H522Q538 374 538 390V502Q538 518 554 518H584"/>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(84 112)">
      <rect width="170" height="100" rx="22" fill="#171520" stroke="#9A8AFB" stroke-opacity=".28"/>
      <rect x="18" y="18" width="38" height="38" rx="12" fill="#9A8AFB" fill-opacity=".14" stroke="#9A8AFB" stroke-opacity=".36"/>
      <path d="M30 39l7-9 8 7-8 9-7-7Z" fill="none" stroke="#BCAEFF" stroke-width="2"/>
      <text x="68" y="37" fill="#F0EDF9" font-size="15" font-weight="700">DESIGN</text>
      <text x="18" y="79" fill="#AFA8BD" font-size="12">Research · UX · Brand</text>
    </g>
    <g transform="translate(506 112)">
      <rect width="170" height="100" rx="22" fill="#171520" stroke="#9A8AFB" stroke-opacity=".28"/>
      <rect x="18" y="18" width="38" height="38" rx="12" fill="#9A8AFB" fill-opacity=".14" stroke="#9A8AFB" stroke-opacity=".36"/>
      <path d="M44 29l7 8-7 8M31 29l-7 8 7 8" fill="none" stroke="#BCAEFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="37" fill="#F0EDF9" font-size="15" font-weight="700">DEVELOP</text>
      <text x="18" y="79" fill="#AFA8BD" font-size="12">Web · Apps · Cloud</text>
    </g>
    <g transform="translate(84 468)">
      <rect width="170" height="100" rx="22" fill="#171520" stroke="#9A8AFB" stroke-opacity=".28"/>
      <rect x="18" y="18" width="38" height="38" rx="12" fill="#9A8AFB" fill-opacity=".14" stroke="#9A8AFB" stroke-opacity=".36"/>
      <circle cx="37" cy="37" r="9" fill="none" stroke="#BCAEFF" stroke-width="2"/>
      <path d="M37 24v5M37 45v5M24 37h5M45 37h5" stroke="#BCAEFF" stroke-width="2" stroke-linecap="round"/>
      <text x="68" y="37" fill="#F0EDF9" font-size="15" font-weight="700">AI SERVICES</text>
      <text x="18" y="79" fill="#AFA8BD" font-size="12">Agents · Automation</text>
    </g>
    <g transform="translate(506 468)">
      <rect width="170" height="100" rx="22" fill="#171520" stroke="#9A8AFB" stroke-opacity=".28"/>
      <rect x="18" y="18" width="38" height="38" rx="12" fill="#9A8AFB" fill-opacity=".14" stroke="#9A8AFB" stroke-opacity=".36"/>
      <path d="M25 46l9-10 7 5 10-13M46 28h5v5" fill="none" stroke="#BCAEFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="37" fill="#F0EDF9" font-size="15" font-weight="700">GROWTH</text>
      <text x="18" y="79" fill="#AFA8BD" font-size="12">Search · Social · Data</text>
    </g>
  </g>

  <g transform="translate(292 254)">
    <rect width="176" height="172" rx="34" fill="#111019" stroke="url(#accent)" stroke-width="2"/>
    <rect x="54" y="26" width="68" height="68" rx="21" fill="url(#accent)" stroke="#fff" stroke-opacity=".28"/>
    <text x="88" y="76" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">S</text>
    <text x="88" y="121" text-anchor="middle" fill="#EAEAF0" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2">ONE ROADMAP</text>
    <text x="88" y="145" text-anchor="middle" fill="#9D96AA" font-family="Inter,Segoe UI,sans-serif" font-size="11">Shared progress · clear ownership</text>
  </g>

  <g fill="#DAD1FF" filter="url(#glow)">
    <circle cx="176" cy="162" r="4"/><circle cx="584" cy="162" r="4"/>
    <circle cx="176" cy="518" r="4"/><circle cx="584" cy="518" r="4"/>
  </g>

  <style>
    .moving-traces path { stroke-dasharray:20 220; animation:flow 4.8s linear infinite; }
    .moving-traces path:nth-child(2) { animation-delay:-1.2s; }
    .moving-traces path:nth-child(3) { animation-delay:-2.4s; }
    .moving-traces path:nth-child(4) { animation-delay:-3.6s; }
    @keyframes flow { to { stroke-dashoffset:-240; } }
    @media (prefers-reduced-motion:reduce) { .moving-traces path { animation:none; stroke-dasharray:none; opacity:.55; } }
  </style>
</svg>
