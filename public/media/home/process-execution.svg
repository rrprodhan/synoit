<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 1010" role="img" aria-labelledby="title desc">
  <title id="title">Execution sprint workspace</title>
  <desc id="desc">A delivery workspace showing design, code, testing, and sprint progress cards inside a mobile screen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="490" y2="1010" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c1421"/>
      <stop offset=".5" stop-color="#15101e"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="150" x2="420" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26d9d0"/>
      <stop offset=".5" stop-color="#9a8afb"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="490" height="1010" rx="78" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
    <text x="72" y="130" font-size="22" font-weight="700" letter-spacing="4" opacity=".58">EXECUTION</text>
    <text x="72" y="168" font-size="34" font-weight="700">Sprint room</text>
  </g>
  <rect x="70" y="224" width="350" height="116" rx="28" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".1"/>
  <rect x="96" y="253" width="168" height="12" rx="6" fill="#fff" fill-opacity=".45"/>
  <rect x="96" y="286" width="264" height="10" rx="5" fill="#fff" fill-opacity=".14"/>
  <rect x="96" y="312" width="218" height="10" rx="5" fill="#fff" fill-opacity=".12"/>
  <circle cx="363" cy="282" r="30" fill="none" stroke="url(#accent)" stroke-width="10" filter="url(#glow)" stroke-dasharray="150 60"/>
  <g>
    <rect x="70" y="396" width="156" height="178" rx="28" fill="#131a28" stroke="#26d9d0" stroke-opacity=".32"/>
    <rect x="264" y="396" width="156" height="178" rx="28" fill="#171322" stroke="#9a8afb" stroke-opacity=".34"/>
    <rect x="70" y="622" width="156" height="178" rx="28" fill="#171322" stroke="#ff4fd8" stroke-opacity=".3"/>
    <rect x="264" y="622" width="156" height="178" rx="28" fill="#111a1c" stroke="#ff8a22" stroke-opacity=".28"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff" font-size="17" font-weight="700">
    <text x="98" y="462">Design</text>
    <text x="292" y="462">Code</text>
    <text x="98" y="688">QA</text>
    <text x="292" y="688">Demo</text>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-linecap="round" stroke-width="8">
    <path d="M99 510h96"/>
    <path d="M99 538h58"/>
    <path d="M293 510h74"/>
    <path d="M293 538h96"/>
    <path d="M99 736h80"/>
    <path d="M99 764h48"/>
    <path d="M293 736h68"/>
    <path d="M293 764h88"/>
  </g>
  <path d="M104 884h282" stroke="#fff" stroke-opacity=".12" stroke-width="12" stroke-linecap="round"/>
  <path d="M104 884h212" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
</svg>
